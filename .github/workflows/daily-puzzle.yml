name: Daily Puzzle Regeneration

on:
  schedule:
    # 18:30 UTC = 00:00 IST (next day)
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate today's puzzles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate:puzzles

      - name: Typecheck generated files
        run: npm run typecheck

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No puzzle changes, skipping commit."
            exit 0
          fi
          git add data/
          git commit -m "chore: regenerate daily puzzles"
          git push
